# ------------------------------------------------------------------
# CronSchedulerPro configuration
# ------------------------------------------------------------------

# Comma-separated list of job identifiers
jobs=printHello,printTime

# Job definitions
job.printHello.type=com.example.cron.task.PrintJob
job.printHello.cron=0/15 * * * * ?
job.printHello.message=Hello, world!

job.printTime.type=com.example.cron.task.PrintJob
job.printTime.cron=0/30 * * * * ?
job.printTime.message=Current time is {time}